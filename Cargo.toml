[package]
name = "dj-ape1"
version = "1.0.0"
edition = "2021"
description = "Dj Ape1 – music library manager (native Rust shell)"
license = "MIT"

[dependencies]
tao = "0.34"
wry = "0.53"
tray-icon = { version = "0.21", default-features = false }
tiny_http = "0.12"
rfd = "0.15"
lofty = "0.22"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
percent-encoding = "2"
dirs = "6"
open = "5"
auto-launch = "0.5"
rand = "0.9"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package.metadata.winresource]
ProductName = "Dj Ape1"
FileDescription = "Dj Ape1 – music library"
LegalCopyright = "Dj Ape1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
