<!DOCTYPE html>
<html lang="el"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dj Ape1</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("mltheme")||"dark";document.documentElement.dataset.skin=localStorage.getItem("mlskin")||""}catch(e){document.documentElement.dataset.theme="dark"}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Grotesk:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<script>if(!window.desktop)document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"><\/script>')</script>
<style>
:root{--bg:#f5f4f0;--card:#fff;--tx:#1c1c1a;--mu:#74736d;--bd:#e4e2dc;--ac:#c2410c;--ac2:#fde7d9;--web:#1d4ed8;--web2:#dde8ff}
@media(prefers-color-scheme:dark){:root{--bg:#141413;--card:#1e1e1c;--tx:#efeee9;--mu:#9b9a93;--bd:#33322f;--ac:#fb923c;--ac2:#3b2413;--web:#85a9ff;--web2:#1b2848}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;font:15px/1.45 system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx)}
button,input,select{font:inherit;color:inherit}
.hide{display:none!important}
/* welcome */
#welcome{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
.box{max-width:520px;width:100%;text-align:center;background:var(--card);border:2px dashed var(--bd);border-radius:20px;padding:44px 28px;transition:.15s}
.box.drag{border-color:var(--ac);background:var(--ac2)}
.box .ic{font-size:56px}.box h1{margin:8px 0 6px;font-size:28px}.box p{color:var(--mu);margin:0 0 22px}
.big{background:var(--ac);color:#fff;border:0;padding:14px 28px;border-radius:12px;font-weight:700;font-size:17px;cursor:pointer}
.big:hover{filter:brightness(1.08)}
.opt{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:20px;color:var(--mu);font-size:14px;cursor:pointer}
.opt input{width:18px;height:18px;accent-color:var(--ac)}
#prog{margin-top:18px;color:var(--mu)}.pb{height:8px;background:var(--bd);border-radius:99px;overflow:hidden;margin-top:8px}.pb i{display:block;height:100%;width:0;background:var(--ac);transition:.2s}
/* app */
#app{display:grid;grid-template-columns:270px 1fr;height:100%}
aside{background:var(--card);border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
aside h2{margin:0;padding:18px 18px 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
#glist{overflow:auto;padding:6px 10px 14px;flex:1}
.gi{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;border-radius:10px;padding:8px 10px;cursor:pointer;text-align:left;position:relative}
.gi:hover{background:var(--bg)}.gi.on{background:var(--ac2);font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:none}.gi .n{margin-left:auto;color:var(--mu);font-size:13px}
.gi .bar{position:absolute;left:10px;bottom:2px;height:2px;border-radius:2px;opacity:.5}
.side-foot{padding:12px 14px;border-top:1px solid var(--bd);display:grid;gap:8px}
.sm{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;cursor:pointer}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:14px 20px;border-bottom:1px solid var(--bd);background:var(--card)}
.top input[type=search]{flex:1;min-width:200px;padding:10px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.top select{padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.seg{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden}.seg button{background:var(--bg);border:0;padding:9px 12px;cursor:pointer}.seg .on{background:var(--ac);color:#fff}
.info{padding:10px 20px;color:var(--mu);font-size:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
#webst{color:var(--web)}
#content{overflow:auto;padding:4px 20px 40px;flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;transition:.12s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px #0002}
.cv{aspect-ratio:1;background:var(--bd) center/cover;display:flex;align-items:center;justify-content:center;font-size:54px;color:var(--mu)}
.cb{padding:10px 12px 12px}.cb b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cb span{color:var(--mu);font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:#fff}
.tag.w{outline:2px solid var(--web);outline-offset:1px}.tag.no{background:none!important;border:1px dashed var(--mu);color:var(--mu);font-weight:400}
.lrow{display:grid;grid-template-columns:48px 1.4fr 1fr 1fr 1.2fr 60px;gap:12px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bd);cursor:pointer}
.lrow:hover{background:var(--card)}.lrow .cv{width:44px;height:44px;aspect-ratio:auto;border-radius:6px;font-size:20px}
.lrow .tags{margin:0}.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mu{color:var(--mu)}
/* modal */
#modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.mc{background:var(--card);border-radius:18px;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:22px}
.mh{display:flex;gap:16px;align-items:flex-start}.mh .cv{width:130px;height:130px;aspect-ratio:auto;border-radius:12px;flex:none}
.mh h2{margin:0 0 4px}.x{margin-left:auto;background:none;border:0;font-size:26px;cursor:pointer;color:var(--mu)}
.gbig{margin:18px 0;padding:14px;border-radius:12px;background:var(--ac2)}.gbig small{display:block;color:var(--mu);margin-bottom:6px}
dl{display:grid;grid-template-columns:max-content 1fr;gap:6px 18px;margin:0}dt{color:var(--mu)}dd{margin:0;word-break:break-word}
.wm{color:var(--web);font-size:12px;font-weight:700}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:99px;z-index:20;font-weight:600}
#bulk{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 20px;background:var(--ac2);border-bottom:1px solid var(--bd)}
.sm.danger{color:#c0392b;font-weight:600}.sm.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card.sel,.lrow.sel{outline:3px solid var(--ac);outline-offset:-3px}.cv{position:relative}.ck{position:absolute;top:4px;left:8px;font-size:22px;color:#fff;text-shadow:0 0 4px #000}
.mt{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.mt .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.mr{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.mr .ell{flex:1}
.fld{display:grid;gap:4px;margin-bottom:10px}.fld input{padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
#glist{min-height:90px}#pllist{max-height:150px;overflow:auto;padding:0 10px 8px}
.pl{position:absolute;right:8px;bottom:8px;width:34px;height:34px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:0;transition:.12s;box-shadow:0 2px 8px #0005}
.card:hover .pl,.lrow:hover .pl{opacity:1}@media(hover:none){.pl{opacity:1}}
.now .cb b,.lrow.now .ell b{color:var(--ac)}.now{box-shadow:inset 0 0 0 2px var(--ac)}
#player{position:fixed;left:270px;right:0;bottom:0;z-index:8;display:flex;align-items:center;gap:16px;padding:10px 18px;background:var(--card);border-top:1px solid var(--bd);box-shadow:0 -4px 16px #0002}
.pcv{width:48px;height:48px;border-radius:8px;background:var(--bd) center/cover;display:flex;align-items:center;justify-content:center;color:var(--mu);flex:none}
.pin{display:flex;flex-direction:column;min-width:0;width:200px;flex:none}.pc{display:flex;gap:4px;align-items:center}
#player button{background:none;border:0;font-size:18px;cursor:pointer;padding:6px 8px;border-radius:8px}#player button:hover{background:var(--bg)}
#player .main{background:var(--ac);color:#fff;width:42px;height:42px;border-radius:50%;font-size:16px}#player .main:hover{background:var(--ac)}
#player button.on{color:var(--ac);background:var(--ac2)}
.pseek{flex:1;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mu);min-width:0}.pseek input{flex:1;accent-color:var(--ac);min-width:60px}
body.hasp #content{padding-bottom:110px}body.hasp aside{padding-bottom:70px}
@media(max-width:760px){#player{left:0;flex-wrap:wrap;gap:8px}.pin{width:calc(100% - 70px)}.pseek{order:5;flex-basis:100%}}
@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{max-height:180px}.lrow{grid-template-columns:44px 1fr 1fr}.lrow .h{display:none}}

/* ===== Dj Ape1 theme ===== */
:root{--bg:#0b0a14;--card:#15132a;--tx:#f1eefc;--mu:#8f8aae;--bd:#2a2650;--ac:#ff2e93;--ac2:#2a1030;--web:#22d3ee;--web2:#0e2f3a;--n2:#22d3ee}
body{font-family:"Space Grotesk",system-ui,sans-serif;background:radial-gradient(900px 500px at 85% -10%,#4a0d5c66,transparent),radial-gradient(800px 500px at -10% 110%,#0a3d6366,transparent),var(--bg);background-attachment:fixed}
h1,h2,h3,.brand,.kp b{font-family:Righteous,"Space Grotesk",sans-serif;font-weight:400}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bar{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
@keyframes eqm{0%{background-size:4px 25%,4px 85%,4px 55%}50%{background-size:4px 90%,4px 35%,4px 80%}100%{background-size:4px 40%,4px 95%,4px 30%}}
.box{background:none;border:0;max-width:680px}.box h1{font-size:84px;margin:6px 0 10px;line-height:1;background:linear-gradient(90deg,var(--ac),var(--n2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #ff2e9366)}
.disc{width:210px;height:210px;margin:0 auto;border-radius:50%;background:radial-gradient(circle,var(--ac) 0 17%,#0b0a14 18% 21%,transparent 22%),repeating-radial-gradient(circle,#1d1a3a 0 2px,#0c0b1f 3px 5px);box-shadow:0 0 70px #ff2e9355,inset 0 0 0 6px #0b0a14;animation:spin 7s linear infinite}
.eqb{display:flex;gap:4px;align-items:flex-end;height:64px;margin:6px auto 26px;max-width:520px}.eqb i{flex:1;height:var(--h);transform-origin:bottom;background:linear-gradient(var(--ac),var(--n2));border-radius:3px;animation:bar 1.1s ease-in-out infinite alternate}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;align-items:center;margin:14px 0}
.big{background:linear-gradient(90deg,var(--ac),#8b5cf6);box-shadow:0 6px 26px #ff2e9355}.big.alt{background:linear-gradient(90deg,#22d3ee,#6366f1);box-shadow:0 6px 26px #22d3ee44}
.sm{border-radius:10px;transition:.12s}.sm:hover{border-color:var(--ac)}
.top{box-shadow:0 1px 0 #ff2e9333}.top input[type=search]:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #ff2e9333}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 2px;font-size:28px}.brand span:last-child{background:linear-gradient(90deg,var(--ac),var(--n2));-webkit-background-clip:text;background-clip:text;color:transparent}
.vin{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--ac) 0 18%,#0b0a14 20% 25%,transparent 27%),repeating-radial-gradient(circle,#1d1a3a 0 2px,#0c0b1f 3px 4px);animation:spin 4s linear infinite;animation-play-state:paused}
body.playing .vin{animation-play-state:running}
.vinyl{background:radial-gradient(circle,var(--ac) 0 10%,#0b0a14 11% 13%,transparent 14%),repeating-radial-gradient(circle,#1d1a3a 0 2px,#0c0b1f 3px 5px)!important;font-size:0!important}
.card{border-radius:10px}.card:hover{box-shadow:0 0 0 1px var(--ac),0 12px 34px #ff2e9344}
.now .cv::after{content:"";position:absolute;left:8px;bottom:8px;width:20px;height:18px;background:linear-gradient(var(--n2),var(--n2)) 0 100%/4px 40% no-repeat,linear-gradient(var(--n2),var(--n2)) 8px 100%/4px 80% no-repeat,linear-gradient(var(--n2),var(--n2)) 16px 100%/4px 55% no-repeat;animation:eqm .9s ease-in-out infinite}
.mc{border:1px solid var(--bd);box-shadow:0 0 60px #ff2e9322}.mc.wide{max-width:1000px}
#player{border-top:1px solid var(--ac);box-shadow:0 -6px 30px #ff2e9333}
.pcv{border-radius:50%;position:relative;border:2px solid #0b0a14;box-shadow:0 0 0 2px var(--bd)}.pcv::after{content:"";position:absolute;inset:42%;border-radius:50%;background:var(--bg)}
body.playing .pcv{animation:spin 6s linear infinite}
#dz{position:fixed;inset:0;z-index:30;background:#0b0a14dd;display:flex;align-items:center;justify-content:center;font:42px Righteous,sans-serif;color:var(--ac);border:4px dashed var(--ac);pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid var(--bd);background:var(--bg);color:var(--tx);padding:5px 11px;border-radius:99px;cursor:pointer;font:inherit}.chip small{color:var(--mu)}.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}.chip.on small{color:#fff}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}.kp{background:linear-gradient(135deg,var(--ac2),var(--bg));border:1px solid var(--bd);border-radius:14px;padding:14px}.kp b{display:block;font-size:32px;color:var(--ac)}.kp span{color:var(--mu);font-size:13px}
.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:14px}.sg section{background:var(--bg);border:1px solid var(--bd);border-radius:14px;padding:14px}.sg h3{margin:0 0 10px;font-size:17px}
.hr{display:grid;grid-template-columns:110px 1fr 42px;gap:8px;align-items:center;margin:6px 0;font-size:13px}.ht{height:10px;background:var(--bd);border-radius:6px;overflow:hidden}.ht i{display:block;height:100%;border-radius:6px}.hr b{text-align:right}
.cols{display:flex;gap:5px;align-items:flex-end;height:200px}.cc{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:11px}.cc i{width:100%;border-radius:5px 5px 0 0;min-height:2px}.cc span{margin-top:4px;color:var(--mu);white-space:nowrap}
.dn{display:flex;gap:16px;align-items:center;flex-wrap:wrap}.lg{font-size:13px;margin:3px 0}.lg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
#printarea{display:none}
@media print{
 :root{--bg:#fff;--card:#fff;--tx:#111;--mu:#555;--bd:#ccc;--ac:#c2185b;--ac2:#fce4ec}
 body{background:#fff!important;color:#111!important;font:12px/1.4 system-ui,sans-serif}
 body>*:not(#printarea){display:none!important}#printarea{display:block!important}
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .ph{border-bottom:3px solid #c2185b;margin-bottom:14px;padding-bottom:6px}.ph h1{margin:0;font-size:26px}
 table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:3px 6px;border-bottom:1px solid #ddd}th{border-bottom:2px solid #111}tr{break-inside:avoid}
 h2{break-after:avoid;margin:18px 0 4px;font-size:16px}.sg section,.kp{break-inside:avoid;background:#fff}
}

/* ===== table, keys, dropdowns ===== */
.tbl{min-width:var(--tw,900px)}
.thead,.trow{display:grid;grid-template-columns:var(--gtc);align-items:center}
.thead{position:sticky;top:0;z-index:3;background:var(--card);border-bottom:1px solid var(--ac);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mu)}
.th{position:relative;padding:11px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;user-select:none}.th:hover{color:var(--tx)}.th.on{color:var(--ac)}
.rz{position:absolute;right:0;top:0;bottom:0;width:10px;cursor:col-resize;touch-action:none}.rz::after{content:"";position:absolute;right:4px;top:25%;bottom:25%;width:2px;background:var(--bd)}.rz:hover::after{background:var(--ac)}
.trow{border-bottom:1px solid var(--bd);min-height:54px}.trow:hover{background:#ffffff0d}.trow.sel{background:var(--ac2)}.trow.focus,.card.focus{background:#ff2e9320}
.trow.now{box-shadow:inset 3px 0 var(--ac)}.trow.now .tc b{color:var(--ac)}
.tc{padding:6px 10px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.tc .tags{flex-wrap:nowrap;margin:0;overflow:hidden}
.trow .cv{width:40px;height:40px;aspect-ratio:auto;border-radius:6px;margin:6px 6px 6px 8px}.trow .cv .pl{display:none}
.ta{display:flex;gap:4px;justify-content:flex-end;padding-right:8px}
.ib{cursor:pointer;color:var(--mu);width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-size:13px}.ib:hover{background:var(--ac);color:#fff}
.card{position:relative}.ibc{position:absolute;top:6px;right:6px;background:#000b;color:#fff;opacity:0}.card:hover .ibc{opacity:1}@media(hover:none){.ibc{opacity:1}}
.kb{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-weight:700;font-size:12px;color:#fff}.kb small{font-weight:400;opacity:.85}
.dd{border:1px solid var(--bd);border-radius:8px;background:var(--bg)}.dd summary{padding:9px 12px;cursor:pointer}
.ddl{max-height:210px;overflow:auto;padding:8px 12px;border-top:1px solid var(--bd);display:grid;gap:5px}.ddl label{display:flex;gap:8px;align-items:center;cursor:pointer}.ddl small{color:var(--mu);margin-left:auto}
.pdel{opacity:0;margin-left:6px;color:var(--mu)}.gi:hover .pdel{opacity:1}.pdel:hover{color:#ff5470}

/* ===== v8: palette (DJ deck look) ===== */
:root{--bg:#1a1a1a;--card:#262626;--tx:#ececec;--mu:#9d9d9d;--bd:#3a3a3a;--ac:#f2a33a;--ac2:#3b2a12;--web:#1fb5e6;--web2:#10303b;--n2:#1fb5e6;--key:#62e0a0;--gold:#f5b335;--btn:linear-gradient(#cf7a22,#a85a12);--row:#222;--rowh:#292929;--sel:#444;--onac:#1a1a1a;color-scheme:dark}
:root[data-theme=light]{--bg:#ecebe6;--card:#fff;--tx:#1d1d1b;--mu:#6c6b66;--bd:#d6d4cc;--ac:#e08a12;--ac2:#fbe9cc;--web:#0a7fa8;--web2:#d8eef6;--n2:#0a7fa8;--key:#15905a;--gold:#b8780a;--btn:linear-gradient(#e89a2c,#c9770f);--row:#f7f6f1;--rowh:#efede5;--sel:#dcdad2;--onac:#1a1a1a;color-scheme:light}
body{background:var(--bg);background-attachment:scroll}*{scrollbar-color:var(--bd) transparent}
.box h1,.brand span:last-child{background:linear-gradient(90deg,var(--ac),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:none}
.disc,.vin,.vinyl{background:radial-gradient(circle,var(--ac) 0 17%,#111 18% 21%,transparent 22%),repeating-radial-gradient(circle,#2c2c2c 0 2px,#141414 3px 5px)!important}
.vinyl{background:radial-gradient(circle,var(--ac) 0 10%,#111 11% 13%,transparent 14%),repeating-radial-gradient(circle,#2c2c2c 0 2px,#141414 3px 5px)!important}
.disc{box-shadow:0 0 50px #f2a33a40,inset 0 0 0 6px #111}
.eqb i{background:linear-gradient(#ff4a3d,var(--ac) 45%,var(--key))}
.big,#player .main{background:var(--btn);color:#fff;box-shadow:none}.big.alt{background:var(--card);border:1px solid var(--ac);color:var(--tx)}
.sm.on,.mt .on,.seg .on{background:var(--btn);color:#fff;border-color:var(--ac)}.sm:hover{border-color:var(--ac)}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}.chip.on small{color:var(--onac)}
.top{background:var(--card);box-shadow:none}.top input[type=search]:focus{box-shadow:none}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center}.tools .sm,.btns .langsel,.btns .themebtn{padding:8px 10px;cursor:pointer}
.gi.on{background:var(--ac2);color:var(--ac)}
.card:hover{box-shadow:0 0 0 1px var(--ac)}.card.now{box-shadow:0 0 0 2px var(--ac)}
.mc{box-shadow:0 12px 60px #0008}
.thead{background:var(--card);border-bottom:2px solid var(--ac)}
.trow{background:var(--row)}.trow:nth-child(even){background:var(--rowh)}.trow:hover{background:var(--sel)}
.trow.focus{background:var(--sel)}.trow.now{background:var(--ac);box-shadow:none;color:var(--onac)}
.trow.now .tc,.trow.now .tc b,.trow.now .kb,.trow.now .ib{color:var(--onac)}.card.focus{background:var(--sel)}

 const pool=()=>{let L=T.filter(t=>t.file);const sid=$("am_src").value,pl=sid&&PL.find(x=>x.id===sid);if(pl)L=L.filter(t=>inPL(t,pl));

  const y1=+$("am_y1").value||0,y2=+$("am_y2").value||0;if(y1||y2)L=L.filter(t=>{const y=parseInt(t.year)||0;return y&&(!y1||y>=y1)&&(!y2||y<=y2)});

 const build=async()=>{const target=(+$("am_d").value||60)*60,pk=$("am_pk").value,ma=+$("am_ma").value||0,cs=$("am_cs").checked&&cur&&cur.file?cur:null,sk=$("am_sk").value,o=$("am_o").value;
  let base=shuffled(pool());if(pk==="p")base.sort((a,b)=>(b.plays||0)-(a.plays||0));else if(pk==="u")base.sort((a,b)=>(a.plays||0)-(b.plays||0));
  let mix=[],tot=0;const cnt=new Map(),ak=t=>lowS(t.artist),bump=t=>{const a=ak(t);if(a)cnt.set(a,(cnt.get(a)||0)+1)};
  if(cs){mix.push(cs);tot+=cs.dur||210;bump(cs)}
  for(const t of base){if(tot>=target)break;if(t===cs)continue;const a=ak(t);if(ma&&a&&(cnt.get(a)||0)>=ma)continue;mix.push(t);bump(t);tot+=t.dur||210}
  if(!mix.length)return null;
  const nk=["k","kd","h","bk"].includes(o)||!!sk,nb=["b","bd","bk"].includes(o);
  if($("am_a").checked&&(nk||nb)){const need=mix.filter(t=>(nk&&!t.cam)||(nb&&!t.bpm));amSkip=false;$("am_skip").classList.remove("hide");for(let i=0;i<need.length;i++){if(amSkip)break;$("am_c").textContent=`🎼 Ανάλυση key ${i+1}/${need.length}…`;$("am_go").textContent=`🎼 Ανάλυση key ${i+1}/${need.length}…`;await analyzeFile(need[i],{key:nk&&!need[i].cam,bpm:nb&&!need[i].bpm})}$("am_skip").classList.add("hide");$("am_go").textContent="▶ Δημιουργία & έναρξη";render()}

  if(wantPts&&$("am_a").checked){const need=mix.filter(t=>!t.pts||t.pts.th!==thr);amSkip=false;$("am_skip").classList.remove("hide");for(let i=0;i<need.length;i++){if(amSkip)break;const msg=`✂ Ανάλυση σημείων μίξης ${i+1}/${need.length}…`;$("am_c").textContent=msg;$("am_go").textContent=msg;await analyzePoints(need[i],thr)}$("am_skip").classList.add("hide");$("am_go").textContent="▶ Δημιουργία & έναρξη";render()}
  if(o==="k")mix=byKey(mix,1);else if(o==="kd")mix=byKey(mix,-1);else if(o==="h"||o==="bk")mix=harmonic(mix,o==="bk",cs);else if(o==="b")mix=byBpm(mix);

  else if(o==="y"||o==="yd"){const d=o==="y"?1:-1;mix=mix.slice().sort((a,b)=>{const x=parseInt(a.year)||0,y=parseInt(b.year)||0;if(!x!==!y)return x?-1:1;return(x-y)*d})}

 if(enProt(t)&&!ENS.prot)return false;const has=t.energy>=1&&t.energy<=10;if(ENS.scope==="new")return!has;if(ENS.scope==="auto")return!has||t.esrc==="auto";return true})}
function enRerank(){const ids=new Set(EW.items.map(x=>x.t)),pool=EW.items.map(x=>({t:x.t,raw:x.raw}));T.forEach(t=>{if(!ids.has(t)&&t.esrc==="auto"&&t.eraw>0)pool.push({t,raw:t.eraw})});
 const r=energyRank(pool);EW.items.forEach(x=>{const o=r.get(x.t);x.g=o.g;x.fb=o.fb;if(!x.edited)x.e=o.e;x.auto=o.e})}

  const r=await energyRaw(t);if(r)EW.items.push({t,raw:r.raw,f:r.f,old:t.energy>=1?t.energy:null,oldSrc:t.esrc||"",e:null,edited:false,g:"",auto:0});if(i%4===3)await new Promise(r=>setTimeout(r))}

/* ===== User guide (⋯ menu → ❓ Οδηγός χρήσης) ===== */
const HELP=[
{id:"start",i:"🚀",t:"Γρήγορη εκκίνηση",h:`
<p>Το Dj Ape1 είναι βιβλιοθήκη και player μουσικής με εργαλεία για DJ: βρίσκει ποια τραγούδια «ταιριάζουν» μεταξύ τους, φτιάχνει αυτόματα ολόκληρα σετ και μπορεί να τα ηχογραφήσει. Δεν χρειάζεσαι εξειδικευμένες γνώσεις — ακολούθησε τα παρακάτω.</p>
<ol class="hl-steps">
<li><b>Πρόσθεσε μουσική.</b> Πάτα το <b>＋</b> πάνω αριστερά → <b>📁 Φάκελοι…</b> και διάλεξε τον φάκελο με τη μουσική σου (ή σύρε φακέλους μέσα στο παράθυρο). Τικάρισε «Σύνδεση φακέλων» αν θες το πρόγραμμα να θυμάται τους φακέλους και να βρίσκει νέα τραγούδια.</li>
<li><b>Άφησέ το να διαβάσει τα στοιχεία.</b> Διαβάζονται αυτόματα τίτλος, καλλιτέχνης, είδος, εξώφυλλο κ.λπ. από τα αρχεία. Όσα λείπουν (είδος, key, BPM) συμπληρώνονται στη συνέχεια — βλέπε «Ανάλυση ήχου».</li>
<li><b>Παίξε.</b> Διπλό κλικ σε ένα τραγούδι, ή <b>▶ Αναπαραγωγή</b> για όλη τη βιβλιοθήκη.</li>
<li><b>Φτιάξε σετ.</b> Πάτα <b>🎧 Dj mode</b> → <b>✨ Εύκολος οδηγός</b>. Απαντάς σε 7 απλές ερωτήσεις (πόσες ώρες, τι ώρα, τι ταξίδι) και το πρόγραμμα στήνει το σετ.</li>
<li><b>Αποθήκευσε τη βιβλιοθήκη</b> (⋯ → 💾 Αποθήκευση βιβλιοθήκης ή «Αυτόματη αποθήκευση») ώστε να μη χάνεις είδη, key, BPM, ενέργεια και playlists.</li>
</ol>
<div class="hl-tip"><b>Σημαντικό:</b> η βιβλιοθήκη κρατά <i>πληροφορίες για</i> τα τραγούδια, όχι τα ίδια τα αρχεία. Τα αρχεία μένουν στον δίσκο σου και δεν αλλάζουν ποτέ (εκτός από τις εγγραφές που κάνεις εσύ). Όταν ανοίγεις ξανά μια αποθηκευμένη βιβλιοθήκη, χρειάζεται να ξαναδώσεις τους φακέλους για να παίζουν τα τραγούδια (📚 → Συγχρονισμός φακέλων).</div>`},

{id:"terms",i:"📖",t:"Βασικές έννοιες (λεξικό)",h:`
<p>Λίγες λέξεις που θα συναντήσεις παντού. Αν τις καταλάβεις, καταλαβαίνεις όλο το πρόγραμμα.</p>
<dl class="hl-dl">
<dt>BPM (beats per minute)</dt><dd>Η ταχύτητα ενός κομματιού: πόσα «χτυπήματα» (beats) έχει ανά λεπτό. Δύο τραγούδια με κοντινό BPM (π.χ. 124 και 126) μπαίνουν εύκολα το ένα μετά το άλλο. Το πρόγραμμα ξέρει ότι το 70 BPM «ταιριάζει» με το 140 (μισή/διπλή ταχύτητα — half-time / double-time).</dd>
<dt>Key (τονικότητα) και Camelot</dt><dd>Η «νότα» στην οποία είναι γραμμένο ένα κομμάτι. Για να μην χρειάζεται μουσική θεωρία, οι DJ τη γράφουν με ένα <b>Camelot code</b>: αριθμός 1–12 και γράμμα <b>A</b> (minor, πιο «σκοτεινό») ή <b>B</b> (major, πιο «φωτεινό»), π.χ. <b>8A</b>.<br>Δύο κομμάτια ακούγονται αρμονικά όταν ο κωδικός τους είναι: <b>ίδιος</b> (8A → 8A), <b>±1 με το ίδιο γράμμα</b> (8A → 9A ή 7A) ή <b>ίδιος αριθμός με το άλλο γράμμα</b> (8A → 8B). Αλλιώς μπορεί να «χτυπάνε» μεταξύ τους.</dd>
<dt>Ενέργεια (1–10)</dt><dd>Πόσο «δυνατό/έντονο» νιώθεις ένα κομμάτι: 1–3 ήρεμο (warm-up), 4–6 μεσαίο, 7–10 κορυφή (peak). Χρησιμοποιείται για να χτιστεί η καμπύλη μιας βραδιάς. Δες την ενότητα «Ενέργεια».</dd>
<dt>Είδη · Crates</dt><dd>Τα μουσικά είδη (House, Techno, Ambient…). Στο αριστερό μενού κάθε είδος είναι ένα «crate» — κλικ και βλέπεις μόνο αυτά τα τραγούδια. Ένα τραγούδι μπορεί να έχει πολλά είδη· το <b>πρώτο</b> είναι το κύριο.</dd>
<dt>Playlist / Έξυπνη playlist</dt><dd>Η απλή playlist είναι μια λίστα που φτιάχνεις εσύ. Η <b>έξυπνη</b> γεμίζει μόνη της με βάση κανόνες (π.χ. «είδος = House και BPM 120–126») και ενημερώνεται καθώς αλλάζει η βιβλιοθήκη.</dd>
<dt>Ουρά (queue)</dt><dd>Η λίστα με ό,τι θα παίξει στη συνέχεια (κουμπί ☰ στον player).</dd>
<dt>Μετάβαση / crossfade / fade</dt><dd>Ο τρόπος που περνάς από ένα τραγούδι στο επόμενο: το πρώτο χαμηλώνει (<b>fade out</b>), το δεύτερο δυναμώνει (<b>fade in</b>), και αν «επικαλύπτονται» ακούγονται μαζί για λίγο (<b>crossfade</b>).</dd>
<dt>Σημεία μίξης</dt><dd>Το πρόγραμμα αναλύει πού τελειώνει η εισαγωγή (intro) και πού αρχίζει το τέλος (outro) κάθε κομματιού, ώστε η μετάβαση να γίνεται στο σωστό σημείο και στο beat.</dd>
</dl>`},

{id:"screen",i:"🖥",t:"Η οθόνη με μια ματιά",h:`
<ul>
<li><b>Αριστερό μενού:</b> στην κορυφή το <b>＋</b> (προσθήκη μουσικής), κάτω τα <b>Είδη · Crates</b> και οι <b>Playlists</b>. Κλικ σε είδος ή playlist φιλτράρει τη λίστα. Το κουμπί <b>☰</b> το κρύβει/εμφανίζει.</li>
<li><b>Πάνω μπάρα:</b> αναζήτηση, <b>▶ Αναπαραγωγή</b>, <b>🔊 Ήχος</b>, <b>👁 Προβολή</b>, και τα κουμπιά <b>📚 Βιβλιοθήκη</b>, <b>🎧 Dj mode</b>, <b>🔴 Rec</b> (εγγραφή), <b>⧉ Μικρό παράθυρο</b>, καθώς και το <b>⋯</b> με τα υπόλοιπα.</li>
<li><b>Κεντρική λίστα:</b> τα τραγούδια, ως πίνακας ή κάρτες. Κλικ σε επικεφαλίδα στήλης ταξινομεί· διπλό κλικ παίζει.</li>
<li><b>Player (κάτω):</b> εξώφυλλο, τίτλος, κουμπιά αναπαραγωγής και γραμμή προόδου. Δες την ενότητα «Player».</li>
<li><b>Μπάρα επιλογής:</b> εμφανίζεται όταν επιλέξεις τραγούδια (⋯ → ☑ Επιλογή τραγουδιών) και δίνει ομαδικές ενέργειες.</li>
</ul>`},

{id:"add",i:"＋",t:"Μενού ＋ Προσθήκη μουσικής",h:`
<ul>
<li><b>📁 Φάκελοι…</b> — Διάλεξε ή σύρε έναν ή περισσότερους φακέλους. «Συμπερίληψη υποφακέλων» διαβάζει και όσα είναι μέσα σε άλλους φακέλους. «Σύνδεση φακέλων» θυμάται τους φακέλους ώστε να ελέγχονται αυτόματα για νέα τραγούδια.</li>
<li><b>🎵 Αρχεία…</b> — Προσθέτει συγκεκριμένα αρχεία.</li>
<li><b>📂 Άνοιγμα βιβλιοθήκης</b> — Ανοίγει ένα αρχείο βιβλιοθήκης που είχες αποθηκεύσει.</li>
<li><b>🔄 Έλεγχος για νέα τραγούδια</b> — Ψάχνει τους συνδεδεμένους φακέλους και προσθέτει μόνο όσα είναι καινούργια.</li>
<li><b>💾 Κράτηση τραγουδιών του player στη βιβλιοθήκη</b> — Αν παίξεις αρχεία χωρίς να τα προσθέσεις (π.χ. τα σύρεις στο παράθυρο), είναι προσωρινά· αυτό το κουμπί τα κρατά μόνιμα.</li>
</ul>
<p class="mu">Δεν δημιουργούνται διπλότυπα: αν το ίδιο αρχείο (ίδιο όνομα και μέγεθος) υπάρχει ήδη, αγνοείται (ρύθμιση «Παράλειψη διπλών αρχείων» στην Παραμετροποίηση οθόνης).</p>`},

{id:"play",i:"▶",t:"Μενού ▶ Αναπαραγωγή",h:`
<ul>
<li><b>▶ Αναπαραγωγή όλων</b> — Παίζει ό,τι εμφανίζεται τώρα στη λίστα (με τα φίλτρα/την αναζήτηση που έχεις).</li>
<li><b>🔀 Τυχαία με φίλτρα…</b> — Τυχαία σειρά, αλλά μόνο από ό,τι ορίζεις: <b>είδη</b>, <b>έτος</b> (από–έως), <b>BPM</b> (από–έως), <b>playlist</b> και πόσα τραγούδια (όλα, 25, 50, 100). Από κάτω βλέπεις πόσα ταιριάζουν.</li>
</ul>`},

{id:"audio",i:"🔊",t:"Μενού 🔊 Ήχος",h:`
<ul>
<li><b>Έξοδος</b> — Διαλέγεις σε ποια συσκευή θα ακούγεται ο ήχος (ηχεία, ακουστικά, κάρτα ήχου DJ). «Προεπιλογή συστήματος» ακολουθεί τα Windows/macOS. <b>🔄 Ανανέωση</b> ξαναψάχνει τις συσκευές (αν έβαλες καινούργια) και <b>＋ Επιλογή συσκευής…</b> σου επιτρέπει να δώσεις άδεια για να εμφανιστούν.</li>
<li><b>🎧 Audiophile mode</b> — Ο ήχος πηγαίνει από το αρχείο στην έξοδο <b>χωρίς καμία επεξεργασία</b>: όχι αλλαγή έντασης, όχι crossfade, όχι analyzer/visualizer κατά την αναπαραγωγή. Ιδανικό για καθαρή ακρόαση. Όσο είναι ενεργό, τα fade του Dj mode, η <b>εγγραφή</b> και η ανάλυση ήχου δεν λειτουργούν — κλείσ' το όταν θες να μιξάρεις ή να ηχογραφήσεις.</li>
</ul>`},

{id:"view",i:"👁",t:"Μενού 👁 Προβολή",h:`
<ul>
<li><b>☰ Πίνακας / ▦ Κάρτες</b> — Δύο τρόποι εμφάνισης της λίστας.</li>
<li><b>Ταξινόμηση</b> και κουμπί <b>↑/↓</b> — Κατά τίτλο, καλλιτέχνη, άλμπουμ, έτος, είδος, key, BPM, διάρκεια, μορφή, μέγεθος, track ή φάκελο.</li>
<li><b>🎆 Visualizer…</b> — Κινούμενα γραφικά που ακολουθούν τη μουσική. Ρυθμίζεις πού εμφανίζεται (πλήρης οθόνη, μικρό στον player, και τα δύο, ή κανένα), στυλ (μπάρες, καθρεφτιζόμενες μπάρες, κυματομορφή, κυκλικό), χρώματα, ευαισθησία, ομαλότητα, λάμψη και ποιότητα (30 ή 60 fps).</li>
<li><b>⚙ Παραμετροποίηση οθόνης…</b> — Ποιες στήλες φαίνονται (εξώφυλλο, τίτλος, καλλιτέχνης… φάκελος), πυκνότητα γραμμών, πότε εμφανίζεται ο player και η ουρά, αυτόματη πλήρης οθόνη όταν ξεκινά τραγούδι, αν η βιβλιοθήκη ανοίγει αυτόματα, αν γίνεται αυτόματος έλεγχος για νέα τραγούδια, και «Μικρές ειδοποιήσεις».</li>
<li><b>🙈 Απόκρυψη μενού</b> — Κρύβει τα μενού για να δεις μόνο τη λίστα (επαναφορά με το <b>☰</b> πάνω-αριστερά ή το πλήκτρο <b>M</b>).</li>
</ul>`},

{id:"more",i:"⋯",t:"Μενού ⋯ Περισσότερα",h:`
<dl class="hl-dl">
<dt>☑ Επιλογή τραγουδιών</dt><dd>Εμφανίζει τετράγωνα για να επιλέξεις πολλά τραγούδια. Η μπάρα που ανοίγει δίνει: <b>Όλα τα εμφανιζόμενα</b>, <b>Καθαρισμός</b>, <b>🏷 Ορισμός είδους</b> (αντικαθιστά τα είδη), <b>➕ Προσθήκη είδους</b> (προσθέτει στα υπάρχοντα), <b>🎶 Στη playlist</b>, <b>🎼 Key / BPM</b> (ανάλυση για τα επιλεγμένα) και <b>🗑 Αφαίρεση</b> (από τη βιβλιοθήκη, όχι από τον δίσκο).</dd>
<dt>🎼 Ανίχνευση key & BPM</dt><dd>Αναλύει τον ήχο όλων των τραγουδιών που δεν έχουν key ή BPM. Μπορείς να τη διακόψεις όποτε θες. Δες «Ανάλυση ήχου».</dd>
<dt>📊 Στατιστικά</dt><dd>Σύνοψη της βιβλιοθήκης: τραγούδια, καλλιτέχνες, άλμπουμ, είδη, ώρες μουσικής, μέγεθος, κατανομή ανά είδος/δεκαετία/μορφή, κορυφαίοι καλλιτέχνες και πόσο πλήρη είναι τα στοιχεία (ποσοστό με είδος, καλλιτέχνη, άλμπουμ, έτος, εξώφυλλο). Μπορείς να δεις όλη τη βιβλιοθήκη ή μόνο όσα εμφανίζονται.</dd>
<dt>🖨 Εκτύπωση</dt><dd>Εκτυπώνει λίστα τραγουδιών, λίστα ομαδοποιημένη ανά είδος ή αναφορά στατιστικών.</dd>
<dt>⚙ Διαχείριση βιβλιοθήκης</dt><dd>Το «συντήρηση». Δες την ειδική ενότητα παρακάτω.</dd>
<dt>💾 Αποθήκευση βιβλιοθήκης</dt><dd>Γράφει όλα τα στοιχεία (είδη, key, BPM, ενέργεια, playlists, ακροάσεις) σε αρχείο.</dd>
<dt>Αυτόματη αποθήκευση</dt><dd>Αποθηκεύει μόνη της σε κάθε αλλαγή. Στον browser χρειάζεται Chrome ή Edge και το πρώτο «Αποθήκευση» για να οριστεί το αρχείο· στην εφαρμογή desktop γίνεται αυτόματα.</dd>
<dt>📂 Άνοιγμα αποθηκευμένης</dt><dd>Ανοίγει ένα αρχείο βιβλιοθήκης που αποθήκευσες.</dd>
<dt>⬇ Εξαγωγή playlist… / ⬇ Εξαγωγή CSV</dt><dd>Δες «Εξαγωγή».</dd>
<dt>🗑 Νέα βιβλιοθήκη</dt><dd>Αδειάζει τη βιβλιοθήκη για να ξεκινήσεις από την αρχή (δεν σβήνει αρχεία μουσικής). Αν δεν έχεις αποθηκεύσει, χάνονται οι πληροφορίες.</dd>
<dt>🎨 Θέμα</dt><dd>Εννέα χρωματικά θέματα: Σκούρο (προεπιλογή), Φωτεινό, Midnight, Forest, Crimson, Violet, AMOLED, Sunset, Mint.</dd>
<dt>Γλώσσα</dt><dd>Ελληνικά ή English.</dd>
<dt>❓ Οδηγός χρήσης</dt><dd>Αυτός ο οδηγός (συντόμευση: <b>F1</b>).</dd>
</dl>`},

{id:"analysis",i:"🎼",t:"Ανάλυση ήχου: key, BPM, σημεία μίξης",h:`
<p>Για να «ταιριάξει» μουσική, το πρόγραμμα πρέπει να ξέρει το <b>key</b> και το <b>BPM</b> κάθε τραγουδιού.</p>
<ol>
<li><b>Από τα tags:</b> αν το αρχείο έχει ήδη key/BPM μέσα του (π.χ. από Mixed In Key, Traktor, Rekordbox) διαβάζονται αμέσως και θεωρούνται αξιόπιστα.</li>
<li><b>Από ανάλυση:</b> για όσα λείπουν, το πρόγραμμα «ακούει» ένα κομμάτι του τραγουδιού (περίπου 100 δευτ. από τη μέση για το key, 45 δευτ. για το BPM) και υπολογίζει τιμές. Ξεκινάς την ανάλυση με <b>⋯ → 🎼 Ανίχνευση key & BPM</b>, με επιλογή τραγουδιών (🎼 Key / BPM), ή αυτόματα όταν φτιάχνεις σετ (το tick «Ανάλυση key / BPM για όσα λείπουν»).</li>
<li><b>Ποτέ δεν αντικαθίστανται</b> τιμές που υπάρχουν ήδη.</li>
</ol>
<div class="hl-tip">Η αυτόματη ανάλυση είναι <b>εκτίμηση</b> και δεν είναι αλάθητη — ειδικά σε κομμάτια χωρίς σαφές beat ή με αλλαγές tempo. Για σοβαρή χρήση, ανάλυσε τη μουσική και με εξειδικευμένο πρόγραμμα (π.χ. Mixed In Key) και άφησε τις τιμές να διαβαστούν από τα tags.</div>
<p><b>Σημεία μίξης (intro/outro/σιωπή):</b> αναλύονται όταν ενεργοποιείς «Έξυπνα σημεία μίξης» ή «Αφαίρεση σιωπής» στις Μεταβάσεις. Αποθηκεύονται ανά τραγούδι ώστε να μην ξαναυπολογίζονται.</p>
<p><b>Δεδομένα από το internet:</b> για τραγούδια που δεν έχουν είδος, καλλιτέχνη, άλμπουμ ή έτος, το πρόγραμμα μπορεί να ψάξει στο iTunes και στο MusicBrainz. Τα αποτελέσματα εμφανίζονται ως <b>προτάσεις με ποσοστό βεβαιότητας</b> (⚙ Διαχείριση → 🌐 Προτάσεις), και εσύ επιλέγεις ποιες θα εφαρμοστούν. Ό,τι ήρθε από το web σημειώνεται, και μπορεί να αναιρεθεί (⚙ → 🧰 Δεδομένα → Αναίρεση).</p>`},

{id:"energy",i:"⚡",t:"Ενέργεια: τι είναι και πώς υπολογίζεται",h:`
<p>Η <b>ενέργεια</b> είναι ένας βαθμός 1–10 που δείχνει πόσο έντονο είναι ένα κομμάτι. Τη χρησιμοποιούν το <b>Set wizard</b> και ο <b>Εύκολος οδηγός</b> για να χτίσουν την καμπύλη μιας βραδιάς (ζέσταμα → ανάβαση → κορυφή → χαλάρωμα).</p>
<h4>Από πού προέρχεται η τιμή (με σειρά προτεραιότητας)</h4>
<ol>
<li><b>Tag «Energy N»</b> στο σχόλιο του αρχείου (το γράφει το Mixed In Key).</li>
<li><b>Χειροκίνητη τιμή</b> που όρισες εσύ.</li>
<li><b>Αυτόματη εκτίμηση</b> από τον ήχο.</li>
</ol>
<h4>Πώς γίνεται η αυτόματη εκτίμηση</h4>
<p>Αναλύονται τα 2 μεσαία λεπτά του τραγουδιού σε 5 περιοχές συχνοτήτων και μετριούνται 4 κριτήρια:</p>
<ul><li><b>Drum weight (30%)</b> — πόσο δυνατά χτυπά το kick και τα κρουστά.</li><li><b>Bassline density (25%)</b> — πόσο γεμίζει το χαμηλό άκουσμα.</li><li><b>Arrangement busyness (25%)</b> — πόσα layers/στρώματα ήχου παίζουν μαζί.</li><li><b>Emotional intensity (20%)</b> — πόσο έντονο και «επείγον» ακούγεται.</li></ul>
<h4>Η σύγκριση γίνεται μέσα στο ίδιο είδος</h4>
<p>Το 1 και το 10 δεν είναι απόλυτα: κάθε κομμάτι κατατάσσεται <b>σε σχέση με όμοιά του</b>. Έτσι ένα ήρεμο techno δεν παίρνει 10 επειδή είναι πιο δυνατό από ambient. Μπορείς να διαλέξεις με τι συγκρίνεται: <b>ίδιο είδος</b> (προεπιλογή), <b>ίδιος φάκελος</b> ή <b>όλη η βιβλιοθήκη</b>. Αν μια ομάδα έχει λιγότερα από 8 τραγούδια, συγκρίνεται με όλη τη βιβλιοθήκη.</p>
<h4>Η καρτέλα «⚡ Ενέργεια» (στο Dj mode)</h4>
<ol>
<li><b>Επιλογή:</b> διάλεξε φακέλους και/ή είδη, ποια τραγούδια θα αναλυθούν (μόνο όσα δεν έχουν ενέργεια · και τα αυτόματα · όλα) και με τι θα συγκριθούν. Προαιρετικά συμπεριλαμβάνονται και όσα έχουν tag ή χειροκίνητη τιμή.</li>
<li><b>Ανάλυση:</b> μπάρα προόδου· με «Διακοπή» βλέπεις όσα αναλύθηκαν.</li>
<li><b>Έλεγχος:</b> τα τραγούδια εμφανίζονται ανά είδος με την προηγούμενη και τη νέα τιμή. Ακούς (▶), αλλάζεις μία τιμή ή βάζεις −1/+1 σε όλο το είδος. <b>Τίποτα δεν έχει αποθηκευτεί ακόμα.</b></li>
<li><b>Αποθήκευση:</b> οι τιμές γράφονται στη βιβλιοθήκη. Όσες διόρθωσες χειροκίνητα σημειώνονται «χειροκίνητες» και δεν θα ξαναγραφτούν από μελλοντική ανάλυση.</li>
</ol>
<p class="mu">Πού αποθηκεύεται: μέσα στα δεδομένα κάθε τραγουδιού της βιβλιοθήκης (όχι στα αρχεία ήχου). Αποθήκευσε τη βιβλιοθήκη για να μη χαθούν.</p>`},

{id:"dj",i:"🎧",t:"Dj mode — γενική εικόνα",h:`
<p>Το κουμπί <b>🎧 Dj mode</b> ανοίγει επτά καρτέλες. Όλες φτιάχνουν μια <b>σειρά τραγουδιών</b> που μπαίνει στην ουρά και παίζει με μεταβάσεις. Η διαφορά τους είναι πόσο «έξυπνα» αποφασίζουν:</p>
<table class="hl-t"><tr><th>Καρτέλα</th><th>Πότε να τη διαλέξεις</th></tr>
<tr><td>✨ Εύκολος οδηγός</td><td>Θες ένα έτοιμο σετ χωρίς καμία τεχνική γνώση. 7 ερωτήσεις και τελείωσες.</td></tr>
<tr><td>🎛 Automix</td><td>Θες γρήγορη λίστα ταξινομημένη κατά key / BPM / έτος / τυχαία, για συγκεκριμένο χρόνο.</td></tr>
<tr><td>🧠 Smart Mix</td><td>Θες το πρόγραμμα να διαλέγει <i>κάθε επόμενο τραγούδι</i> με βάση πόσο ταιριάζει στο προηγούμενο.</td></tr>
<tr><td>🧭 Set wizard</td><td>Θες πλήρη έλεγχο: φάσεις βραδιάς, καμπύλη ενέργειας, κινήσεις key, είδη και BPM ανά φάση.</td></tr>
<tr><td>⚡ Ενέργεια</td><td>Θες να βαθμολογήσεις τα τραγούδια σου 1–10 πριν φτιάξεις σετ.</td></tr>
<tr><td>🔮 Next track</td><td>Παίζεις ζωντανά και θες προτάσεις για το επόμενο κομμάτι.</td></tr>
<tr><td>🎶 Playlists</td><td>Θες να παίξεις υπάρχουσα playlist με μεταβάσεις.</td></tr></table>
<h4>🎚 Μεταβάσεις (κοινές σε όλες τις καρτέλες)</h4>
<p>Σε κάθε καρτέλα υπάρχει ένα πεδίο «Μεταβάσεις». Οι ρυθμίσεις του <b>θυμούνται</b> και μοιράζονται σε όλες.</p>
<ul>
<li><b>Fade out / Fade in (δευτ.)</b> — Πόσο αργά χαμηλώνει το τραγούδι που τελειώνει και ανεβαίνει το επόμενο. 0 = χωρίς fade (άμεση αλλαγή).</li>
<li><b>Επικάλυψη</b> — Αν είναι ενεργή, το επόμενο ξεκινά <i>όταν αρχίζει</i> το fade out του προηγούμενου, οπότε ακούγονται μαζί (crossfade). Αν όχι, το ένα τελειώνει και μετά ξεκινά το άλλο.</li>
<li><b>Αφαίρεση σιωπής</b> στην αρχή / στο τέλος — Κόβει τα κενά που έχουν πολλά αρχεία. Το <b>Όριο σιωπής</b> (−60/−50/−40 dB) ορίζει πόσο χαμηλός ήχος θεωρείται «σιωπή» (το −40 κόβει πιο επιθετικά).</li>
<li><b>🧠 Έξυπνα σημεία μίξης</b> — Το πρόγραμμα διαλέγει μόνο του πότε θα γίνει η μετάβαση (από το outro στο intro, πάνω στο beat) και πόσο θα κρατήσει, ανάλογα με το πόσο ταιριάζουν τα δύο κομμάτια. Θέλει μια πρώτη ανάλυση.</li>
<li><b>Τρόπος μίξης (έτοιμες ρυθμίσεις)</b> — Με ένα κλικ γεμίζει τα παραπάνω: <b>Μακρύ blend 16΄΄</b> (chill / deep), <b>Smooth crossfade 8΄΄</b>, <b>Tight beatmix 4΄΄</b> (house / techno), <b>Γρήγορο cut 1΄΄</b> (rock / dub) και <b>Fade out → fade in χωρίς επικάλυψη</b> (γέφυρα). Αν αλλάξεις κάποιο πεδίο, επιστρέφει σε «Χειροκίνητα». Βρίσκεται σε όλες τις καρτέλες του Dj mode· στον Εύκολο οδηγό και στο Set wizard μπορείς να ορίσεις διαφορετικό τρόπο <b>ανά φάση</b> (π.χ. blend στο warm-up, tight στο peak, cut στο rock) — ιδανικό για πολύωρα προγράμματα.</li>
<li><b>Καμπύλη μίξης</b> — <b>Ισχύος (equal-power)</b>: το τραγούδι που φεύγει και αυτό που έρχεται κρατούν σταθερή «αίσθηση έντασης» (προεπιλογή, ταιριάζει σχεδόν παντού). <b>Γραμμική (linear)</b>: τα δύο fade είναι ευθείες γραμμές που αθροίζονται σε σταθερό επίπεδο — καλύτερη όταν τα κομμάτια είναι beatmatched και ίδιου key, γιατί δεν «φουσκώνει» η ένταση στη μέση. Ορίζεται και ανά φάση.</li>
</ul>
<h4>✂ Χειροκίνητα σημεία fade ανά τραγούδι (δεξί κλικ)</h4>
<p>Κάνε <b>δεξί κλικ</b> σε ένα τραγούδι → <b>✂ Σημεία fade in / fade out…</b>. Ανοίγει παράθυρο με την κυματομορφή και τέσσερις δείκτες που σέρνεις (ή γράφεις τιμές):</p>
<ul><li><b>Αρχή fade in</b> — από πού ξεκινά το τραγούδι όταν «μπαίνει» (ό,τι είναι πριν παραλείπεται, π.χ. μια μεγάλη σιωπή).</li><li><b>Τέλος fade in</b> — εδώ φτάνει σε πλήρη ένταση. Η απόσταση από την αρχή είναι η διάρκεια του fade in.</li><li><b>Αρχή fade out</b> — εδώ αρχίζει να χαμηλώνει <i>και μπαίνει το επόμενο τραγούδι</i> (επικάλυψη).</li><li><b>Τέλος (σιγή)</b> — εδώ σταματά εντελώς. Η απόσταση από το «Αρχή fade out» είναι η διάρκεια του fade out/επικάλυψης.</li><li><b>Καμπύλη fade</b> — Ισχύος ή γραμμική μόνο για αυτό το τραγούδι (αλλιώς ισχύει η γενική ρύθμιση). Η ακρόαση χρησιμοποιεί την ίδια καμπύλη.</li></ul>
<p>Με το <b>▶ Ακρόαση</b> ακούς το τραγούδι με τα fade που όρισες, και με το <b>⇤ εδώ</b> βάζεις έναν δείκτη στη θέση που ακούς. <b>🧠 Αυτόματα σημεία</b> προτείνει τιμές από την ανάλυση σιωπής. Τα χειροκίνητα σημεία ισχύουν σε κάθε αναπαραγωγή (και σε όλες τις καρτέλες Dj mode) και αντικαθιστούν τις γενικές ρυθμίσεις για αυτό το τραγούδι· αποθηκεύονται μαζί με τη βιβλιοθήκη.</p>
<div class="hl-tip">Με ενεργό <b>Audiophile mode</b> οι μεταβάσεις είναι απενεργοποιημένες.</div>`},

{id:"easy",i:"✨",t:"Dj mode → ✨ Εύκολος οδηγός",h:`
<p>Ένα βήμα ανά οθόνη, με απλές ερωτήσεις. Στο τέλος παίρνεις ολόκληρο σετ.</p>
<ol class="hl-steps">
<li><b>Διάρκεια</b> — 1, 2, 3, 4, 6, 8 ώρες ή δική σου.</li>
<li><b>Ώρα έναρξης</b> (προαιρετικό) — Για να βλέπεις το πρόγραμμα με ώρες ρολογιού (π.χ. «22:00 Warm-up · 00:20 Peak»).</li>
<li><b>Ταξίδι</b> — Το σχήμα της βραδιάς: <b>🌙 Κλασική νύχτα</b> (ζέσταμα → ανάβαση → κορυφή → χαλάρωμα), <b>⛰️ Δύο κορυφές</b>, <b>🔥 Peak-time</b> (μένει ψηλά), <b>🧭 Ταξίδι ειδών</b> (chill → deep house → tech house → techno), <b>🌴 Από reggae/dub σε house</b> και <b>🚀 Πολύωρο ταξίδι</b> (5–6 ώρες, πολλά είδη).</li>
<li><b>Από πού να πάρω μουσική</b> — Όλη η βιβλιοθήκη ή μια playlist. Το tick «Να αναλύσω αυτόματα ό,τι λείπει» υπολογίζει key, BPM και ενέργεια (έως 250 τραγούδια ανά φορά).</li>
<li><b>Πόσο ομαλές οι αλλαγές</b> — Διακόπτες: <b>Half-time/double-time</b> (το 70 BPM ταιριάζει με 140), <b>Γέφυρες BPM</b> (όταν το tempo πρέπει να αλλάξει πολύ, μπαίνουν 2–3 ενδιάμεσα κομμάτια), <b>Χωρίς επαναλήψεις καλλιτεχνών</b>, <b>Έξυπνες μεταβάσεις</b>.</li>
<li><b>Έλεγχος προγράμματος</b> — Κάθε φάση έχει φανάρι: 🟢 άνετα · 🟡 οριακά · 🔴 λίγη μουσική (άλλαξε είδος ή εύρος BPM). Σύρε τα μπλοκ για να αλλάξεις σειρά, όρισε διάρκεια και είδος ανά φάση.</li>
<li><b>Όλα έτοιμα</b> — Περίληψη και «✨ Φτιάξε το σετ».</li>
</ol>
<p><b>Αποτέλεσμα:</b> βλέπεις το σετ ως χρονοδιάγραμμα και λίστα με τη «μέση ποιότητα μετάβασης». Μπορείς να <b>κλειδώσεις (🔒)</b> ό,τι σου αρέσει (τραγούδι ή ολόκληρη φάση) και να πατήσεις <b>«🔄 Άλλαξε τη φάση»</b> εκεί που δεν σε κάλυψε — τα κλειδωμένα μένουν. Το <b>🔁</b> σε κάθε τραγούδι δείχνει συμβατές εναλλακτικές (key, BPM, ενέργεια). Τέλος: <b>▶ Παίξε το σετ</b> ή <b>💾 Αποθήκευση ως playlist</b>.</p>`},

{id:"automix",i:"🎛",t:"Dj mode → 🎛 Automix",h:`
<p>Γρήγορη δημιουργία λίστας για συγκεκριμένο χρόνο, ταξινομημένης με κάποιο κανόνα.</p>
<dl class="hl-dl">
<dt>Πηγή</dt><dd>Όλη η βιβλιοθήκη ή μια playlist.</dd>
<dt>Διάρκεια μίξης</dt><dd>30΄, 1 ώρα, 90΄, 2 ώρες, 3 ώρες.</dd>
<dt>Είδη</dt><dd>Περιορίζεις σε συγκεκριμένα είδη.</dd>
<dt>Σειρά τραγουδιών</dt><dd><b>Key αύξουσα/φθίνουσα</b> (1→12 ή 12→1), <b>Αρμονική</b> (ομαλές μεταβάσεις κατά Camelot), <b>BPM αύξουσα/φθίνουσα</b>, <b>Key + BPM</b> (ομαλές μεταβάσεις και στα δύο), <b>Ομαδοποίηση ανά είδος (+BPM)</b>, <b>Έτος αύξουσα/φθίνουσα</b>, <b>Τυχαία</b>.</dd>
<dt>⚙ Περισσότερες επιλογές</dt><dd>Εύρος BPM και έτους · <b>Επιλογή υλικού</b> (τυχαία, τα πιο ακουσμένα πρώτα, τα λιγότερο ακουσμένα πρώτα) · <b>Αρχή από key</b> (αυτόματα ή συγκεκριμένο, π.χ. 8A) · «Ξεκίνημα από το τρέχον τραγούδι» · <b>Μέγιστα ανά καλλιτέχνη</b> · <b>Απόσταση ίδιου καλλιτέχνη</b> (πόσα τραγούδια να μεσολαβούν) · <b>Εξαίρεση όσων έπαιξαν πρόσφατα</b> (1 ώρα έως 1 εβδομάδα) · Αντίστροφη σειρά · Μόνο όσα δεν έχουν παιχτεί ποτέ · Μόνο όσα έχουν key και BPM · Μόνο lossless (FLAC/WAV/AIFF…).</dd>
</dl>
<p>Κάτω φαίνεται πόσα τραγούδια ταιριάζουν στα φίλτρα. Κουμπιά: <b>▶ Δημιουργία & έναρξη</b>, <b>👁 Προεπισκόπηση</b> (βλέπεις τη λίστα πριν παίξει) και <b>💾 Αποθήκευση ως playlist</b>.</p>`},

{id:"smart",i:"🧠",t:"Dj mode → 🧠 Smart Mix",h:`
<p>Σαν το Automix, αλλά το πρόγραμμα επιλέγει <b>κάθε επόμενο τραγούδι ξεχωριστά</b>, βαθμολογώντας πόσο ταιριάζει στο προηγούμενο.</p>
<h4>Πώς διαλέγει</h4>
<p>Σε κάθε βήμα συγκρίνει τους υποψήφιους με το τραγούδι που μόλις έπαιξε και δίνει βαθμό (0–100%) με βάση:</p>
<ul><li><b>Key (Camelot)</b> — το βασικό κριτήριο: ίδιο ή γειτονικό key παίρνει περισσότερους πόντους.</li><li><b>BPM</b> — όσο πιο κοντινό, τόσο καλύτερα (λαμβάνεται υπόψη και το half/double time).</li><li><b>Είδος</b> — ίδιο είδος βοηθά.</li><li><b>Ποικιλία καλλιτεχνών</b> — ο ίδιος καλλιτέχνης ξανά και ξανά «τιμωρείται».</li><li><b>Πρόσφατες ακροάσεις</b> — ό,τι άκουσες πρόσφατα αποφεύγεται.</li></ul>
<h4>Ρυθμίσεις</h4>
<ul>
<li><b>Πηγή, Είδη, BPM, Διάρκεια</b> όπως παραπάνω.</li>
<li><b>Ροή ενέργειας (BPM)</b> — Πώς εξελίσσεται το tempo: <b>Σταθερή</b>, <b>Ανοδική</b> (από χαμηλό σε υψηλό), <b>Καθοδική</b>, <b>Κύμα</b> (ανεβαίνει και κατεβαίνει), <b>Κορύφωση</b> (ανεβαίνει και στο τέλος κατεβαίνει).</li>
<li><b>Αρμονία key</b> — <b>Αυστηρή</b> (μόνο συμβατά keys) ή <b>Ελεύθερη</b> (επιτρέπει και λιγότερο συμβατά για περισσότερη ποικιλία).</li>
<li><b>Έναρξη από</b> — Αυτόματα (το πρόγραμμα βρίσκει καλή αρχή) ή από το τρέχον/επιλεγμένο τραγούδι.</li>
</ul>
<p>Το κουμπί <b>🔀 Δημιουργία</b> φτιάχνει τη λίστα. Υπάρχει και συντόμευση από έξυπνη playlist: «🧠 Smart Mix από αυτή τη λίστα».</p>`},

{id:"wizard",i:"🧭",t:"Dj mode → 🧭 Set wizard",h:`
<p>Το πιο ισχυρό εργαλείο: σχεδιάζεις ολόκληρη βραδιά σε <b>φάσεις</b> (Warm-up, Build-up, Peak, Cool-down…), και το πρόγραμμα διαλέγει τραγούδια ώστε η ενέργεια, το key και το BPM να ακολουθούν το σχέδιο.</p>
<h4>Βήμα 1 · Στυλ & πηγή</h4>
<ul><li><b>Στυλ</b> — Έτοιμα προφίλ BPM: Deep house 118–124, Classic/vocal house 120–126, Tech house 122–128, Toward techno 128+ ή Προσαρμοσμένο (ορίζεις εσύ). Κάθε ένα έχει σύντομη συμβουλή (π.χ. για φωνητικά κομμάτια χρειάζεται προσοχή στις αλλαγές pitch).</li><li><b>Μέγιστο άλμα BPM</b> ανά μετάβαση (±2 έως ±10).</li><li><b>½×/2× BPM</b> — Το 70 θεωρείται ίσο με 140, για περάσματα από dub/reggae σε house/techno.</li><li><b>Πηγή και είδη</b> της βιβλιοθήκης.</li></ul>
<h4>Βήμα 2 · Φάσεις, είδη & mix</h4>
<p>Διαλέγεις πρότυπο (Σύντομο 1 ώρας, Κλασικό 2 ωρών, Μακρύ 3 ωρών, Peak-time 90΄, Δύο κορυφές, Πολύωρο ταξίδι) και για <b>κάθε φάση</b> ορίζεις:</p>
<ul><li><b>Όνομα και διάρκεια</b> (λεπτά).</li><li><b>Ενέργεια από → προς</b> (1–10) — π.χ. Warm-up 3→5.</li><li><b>Κίνηση key</b> — <b>Αυτόματο</b> (ακολουθεί την ενέργεια), <b>Σταθερό</b> (same code), <b>Ανέβασμα (+1)</b>, <b>Κατέβασμα (−1)</b>.</li><li><b>Είδος</b> (πολλά με κόμμα· ταιριάζει και μερικό όνομα, π.χ. «house») και <b>εύρος BPM</b> δικό της φάσης (κενό = ισχύουν τα γενικά).</li><li><b>Τρόπος μίξης</b> — Μακρύ blend 16΄΄ (chill/deep) · Smooth crossfade 8΄΄ · Tight beatmix 4΄΄ (house/techno) · Γρήγορο cut 1΄΄ (rock/dub) · Fade out → fade in χωρίς επικάλυψη (γέφυρα) · ή «γενικές ρυθμίσεις».</li></ul>
<h4>Βήμα 3 · Ενέργεια & κανόνες</h4>
<ul><li><b>Οδηγός key = ενέργεια:</b> <b>Same code</b> (8A→8A) = διαφανές blend, επίπεδη ενέργεια, ιδανικό για peak · <b>±1 ίδιο γράμμα</b> (8A→9A) = απαλό ανέβασμα, το 7A το κατεβάζει· 3–4 κινήσεις +1 μέσα σε μια ώρα σε πάνε από warm-up σε peak · <b>A↔B ίδιος αριθμός</b> (8A→8B) = αλλαγή διάθεσης από minor σε major και πίσω.</li>
<li><b>Ένα βήμα +1 στο key ανά</b> … βαθμούς ενέργειας (1, 1,5, 2, 3) — πόσο γρήγορα ανεβαίνει το key όταν ανεβαίνει η ενέργεια.</li>
<li><b>Mood switch A↔B</b> — Σε στιγμές σταθερής ενέργειας εναλλάσσει minor/major κάθε Ν τραγούδια.</li>
<li><b>Ανάλυση key/BPM</b> και <b>ενέργειας</b> για όσα λείπουν, με όριο ανά εκτέλεση.</li>
<li><b>Μέγιστα ανά καλλιτέχνη</b>, <b>Απόσταση ίδιου καλλιτέχνη</b>, <b>Τυχαιότητα</b> και <b>Αποφυγή όσων έπαιξαν τις τελευταίες 12 ώρες</b>.</li></ul>
<p class="mu">Αν ένα τραγούδι δεν έχει ενέργεια, το πρόγραμμα τη <b>μαντεύει από το BPM</b> και σε προειδοποιεί. Για καλύτερο αποτέλεσμα, βαθμολόγησε πρώτα τη βιβλιοθήκη από την καρτέλα ⚡ Ενέργεια.</p>
<h4>Βήμα 4 · Αποτέλεσμα</h4>
<p>Χρονοδιάγραμμα της βραδιάς, καμπύλη ενέργειας (στόχος και πραγματική), και λίστα τραγουδιών με ποιότητα μετάβασης. Μπορείς να <b>κλειδώσεις (🔒)</b> τραγούδια ή φάσεις και να πατήσεις <b>🔀 Νέα εκδοχή</b> (κρατά τα 🔒), να αλλάξεις την ενέργεια ενός τραγουδιού, και να επιλέξεις: <b>▶ Παίξε το σετ</b>, <b>💾 Αποθήκευση ως playlist</b>, <b>⬇ CSV</b> (λίστα με ώρες για εκτύπωση ή αρχείο).</p>`},

{id:"next",i:"🔮",t:"Dj mode → 🔮 Next track & 🎶 Playlists",h:`
<h4>🔮 Next track — προτάσεις για το επόμενο κομμάτι</h4>
<p>Βλέπεις τα καλύτερα επόμενα τραγούδια για αυτό που παίζει τώρα. Κάθε πρόταση έχει ποσοστό (π.χ. 96%) και τις αιτίες: το Camelot (π.χ. 1A→2A), το BPM (π.χ. 120→124), «είδος». Υπολογίζεται από το key (μέγιστη βαρύτητα), το BPM, το κοινό είδος και την εγγύτητα έτους· μειώνεται αν είναι ο ίδιος καλλιτέχνης ή αν παίχτηκε τις τελευταίες 12 ώρες.</p>
<ul><li><b>▶</b> παίζει το τραγούδι αμέσως · <b>⏭</b> το βάζει επόμενο · <b>➕</b> το προσθέτει στο τέλος της ουράς.</li>
<li><b>Εφαρμογή μεταβάσεων στην ουρά που παίζει</b> — Εφαρμόζει τα fade σε ό,τι ήδη παίζει.</li>
<li><b>Αυτόματη συνέχεια (Auto DJ)</b> — Όταν τελειώσει η ουρά, παίζει μόνο του την καλύτερη πρόταση και συνεχίζει όσο θες.</li></ul>
<h4>🎶 Playlists</h4>
<p>Εδώ βλέπεις τις playlists σου: <b>➕ Νέα</b>, <b>✨ Νέα έξυπνη</b>, και για κάθε μία παίξιμο με τις ρυθμίσεις μεταβάσεων. Το <b>Τυχαία σειρά</b> ανακατεύει τη σειρά.</p>
<h4>✨ Έξυπνες playlists — κανόνες</h4>
<p>Διαλέγεις <b>όλοι οι κανόνες</b> ή <b>οποιοσδήποτε</b> κανόνας και προσθέτεις κανόνες πάνω σε: <b>Είδος, Καλλιτέχνη, Τίτλο, Άλμπουμ, Έτος, BPM, Key (Camelot), Διάρκεια (λεπτά), Αριθμό ακροάσεων, Τελευταία ακρόαση, Αρχείο</b>. Η λίστα ενημερώνεται μόνη της και δείχνει πόσα τραγούδια ταιριάζουν.</p>`},

{id:"player",i:"🎵",t:"Player, πλήρης οθόνη και μικρό παράθυρο",h:`
<ul>
<li><b>Κουμπιά:</b> 🔀 τυχαία σειρά · ⏮ προηγούμενο · ▶/⏸ · ⏭ επόμενο · 🔁 επανάληψη (πατήματα: καμία → όλα → ένα τραγούδι 🔂).</li>
<li><b>Γραμμή προόδου:</b> δείχνει τη <b>κυματομορφή</b> του τραγουδιού (αν είναι ενεργή στις ρυθμίσεις οθόνης). Κάνε κλικ για να πας σε σημείο.</li>
<li><b>☰ Ουρά:</b> η λίστα με ό,τι θα παίξει. Κλικ σε τραγούδι για να πας εκεί, ✕ για να το αφαιρέσεις από την ουρά.</li>
<li><b>⛶ Πλήρης οθόνη:</b> μεγάλο εξώφυλλο (βινύλιο), κυματομορφή, visualizer και στοιχεία του τραγουδιού. Πλήκτρο <b>F</b> για άνοιγμα, <b>L</b> για εμφάνιση/απόκρυψη της λίστας, <b>Esc</b> για κλείσιμο.</li>
<li><b>⋯ (στον player):</b> 🎶 Προσθήκη στη playlist · ⓘ Πληροφορίες / επεξεργασία (τίτλος, καλλιτέχνης, άλμπουμ, έτος, είδη).</li>
<li><b>⧉ Μικρό παράθυρο:</b> ένα μικρό παράθυρο με τα βασικά χειριστήρια πάνω από τα άλλα προγράμματα (<b>Ctrl+Shift+M</b>). Εκεί: Διάστημα = παύση, ← → = προηγούμενο/επόμενο.</li>
</ul>
<h4>Συντομεύσεις πληκτρολογίου</h4>
<table class="hl-t"><tr><td><kbd>Διάστημα</kbd></td><td>Αναπαραγωγή / παύση</td></tr><tr><td><kbd>F</kbd></td><td>Πλήρης οθόνη player</td></tr><tr><td><kbd>L</kbd></td><td>Λίστα στην πλήρη οθόνη</td></tr><tr><td><kbd>M</kbd></td><td>Απόκρυψη / εμφάνιση μενού</td></tr><tr><td><kbd>Ctrl+Shift+M</kbd></td><td>Μικρό παράθυρο</td></tr><tr><td><kbd>F11</kbd></td><td>Πλήρης οθόνη εφαρμογής (desktop)</td></tr><tr><td><kbd>F1</kbd></td><td>Αυτός ο οδηγός</td></tr><tr><td><kbd>Esc</kbd></td><td>Κλείσιμο παραθύρων και μενού</td></tr></table>`},

{id:"rec",i:"🔴",t:"Εγγραφή (🔴 Rec)",h:`
<p>Ηχογραφεί <b>ό,τι παίζει το πρόγραμμα</b>, μαζί με τα fade και τα crossfade του Dj mode — έτσι μπορείς να κρατήσεις ένα ολόκληρο σετ ως ένα αρχείο.</p>
<ol>
<li>Πάτα <b>🔴 Rec</b> και διάλεξε <b>μορφή</b>: MP3 320 kbps (44.1 kHz — πρότυπο CD, ή 48 kHz), FLAC 16-bit 44.1 kHz (CD), FLAC 16-bit 48 kHz, FLAC 24-bit 48 kHz. Το <b>FLAC</b> είναι χωρίς απώλειες· το <b>MP3 320</b> είναι μικρότερο και παίζει παντού.</li>
<li>Γράψε το <b>όνομα αρχείου</b>. Μεταβλητές: <code>{date}</code> ημερομηνία, <code>{time}</code> ώρα, <code>{title}</code> τίτλος τρέχοντος τραγουδιού. Βλέπεις την προεπισκόπηση του ονόματος.</li>
<li>Διάλεξε <b>φάκελο αποθήκευσης</b> (στην εφαρμογή desktop γράφεται κατευθείαν εκεί· στον browser, Chrome/Edge για φάκελο, αλλιώς κατεβαίνει στις Λήψεις).</li>
<li>Πάτα <b>Έναρξη εγγραφής</b> και μετά Play (ή αντίστροφα). Το κουμπί γίνεται κόκκινο και δείχνει τον χρόνο· μπορείς να κάνεις <b>παύση</b> ή <b>⏹ Διακοπή & αποθήκευση</b>.</li>
</ol>

{id:"library",i:"📚",t:"Βιβλιοθήκη, αποθήκευση και αντίγραφα",h:`
<h4>Κουμπί 📚 Βιβλιοθήκη</h4>
<ul><li>Δείχνει πόσα τραγούδια έχεις, πόσα έχουν συνδεδεμένο αρχείο και πόσα χρειάζονται επανασύνδεση, και πόσα περιττά αντίγραφα υπάρχουν (🧹 Καθαρισμός).</li><li><b>⟳ Συγχρονισμός φακέλων</b> — Επανασυνδέει αρχεία που λείπουν, προσθέτει μόνο τα νέα και συγχωνεύει αντίγραφα. Δεν δημιουργεί διπλότυπα.</li><li><b>➕ Προσθήκη φακέλου…</b>, και κουμπιά ⟳/✕ ανά φάκελο (ανανέωση/αφαίρεση).</li><li><b>📂 Εισαγωγή αρχείου βιβλιοθήκης…</b>, <b>💾 Εξαγωγή</b>, <b>🆕 Νέα βιβλιοθήκη</b>.</li></ul>
<h4>Πού αποθηκεύονται τα δεδομένα</h4>
<ul><li><b>Στον browser:</b> στο αρχείο που ορίζεις με «Αποθήκευση βιβλιοθήκης» (Chrome/Edge) και, αν είναι ενεργή η ρύθμιση, και στη μνήμη του browser.</li><li><b>Στην εφαρμογή desktop:</b> σε αρχείο βιβλιοθήκης της εφαρμογής, με <b>αυτόματα αντίγραφα ασφαλείας</b> (⚙ Διαχείριση → 🧰 Δεδομένα → Αντίγραφα ασφαλείας: άνοιγμα φακέλου και «Επαναφορά…»).</li></ul>
<div class="hl-tip">Τα <b>αρχεία μουσικής</b> δεν αποθηκεύονται μέσα στη βιβλιοθήκη. Αν μεταφέρεις τη βιβλιοθήκη σε άλλον υπολογιστή, πήγαινε και τους φακέλους με τη μουσική και κάνε Συγχρονισμό φακέλων.</div>
<h4>Εξαγωγή playlist (⋯ → ⬇ Εξαγωγή playlist…)</h4>
<p>Διάλεξε <b>τι</b> θα εξαχθεί (εμφανιζόμενα, όλη η βιβλιοθήκη, ουρά) και <b>μορφή</b>: M3U8 (το πιο συνηθισμένο), PLS, CSV (για Excel) ή απλή λίστα κειμένου. Στις <b>διαδρομές αρχείων</b>: σχετικές, πλήρεις (με πρόθεμα π.χ. <code>D:\\</code>) ή μόνο όνομα. Η επιλογή «Προσθήκη key και BPM στον τίτλο» είναι χρήσιμη για DJ λογισμικά. Κουμπιά: Λήψη αρχείου ή Αντιγραφή.</p>`},

{id:"manage",i:"⚙",t:"⚙ Διαχείριση βιβλιοθήκης (οι 8 καρτέλες)",h:`
<dl class="hl-dl">
<dt>📁 Φάκελοι</dt><dd>Λίστα φακέλων με πλήθος τραγουδιών. «Αφαίρεση» βγάζει τα τραγούδια του φακέλου από τη βιβλιοθήκη — τα αρχεία στον δίσκο δεν αγγίζονται.</dd>
<dt>🏷 Είδη</dt><dd>Όλα τα είδη με πλήθος. Μετονομασία (αν υπάρχει ήδη το όνομα γίνεται συγχώνευση — π.χ. «Hip-Hop/Rap» → «Hip Hop») και αφαίρεση ενός είδους από όλα τα τραγούδια.</dd>
<dt>♊ Διπλότυπα</dt><dd>Βρίσκει διπλά τραγούδια (ίδιο αρχείο, ίδιο τραγούδι κατά tags, ή ίδιος τίτλος και διάρκεια). Η συγχώνευση κρατά το <b>καλύτερο</b> αντίγραφο (προτιμά lossless, με εξώφυλλο, πλήρη στοιχεία), μεταφέρει σε αυτό ακροάσεις και playlists και αφαιρεί τα υπόλοιπα <b>από τη βιβλιοθήκη</b> (όχι από τον δίσκο).</dd>
<dt>🎶 Playlists</dt><dd>Μετονομασία και διαγραφή playlists (τα τραγούδια δεν διαγράφονται).</dd>
<dt>🔗 Σύνδεση φακέλων</dt><dd>Οι συνδεδεμένοι φάκελοι και αν έχουν άδεια πρόσβασης — από εδώ τους επανασυνδέεις ή ανανεώνεις (π.χ. μετά το άνοιγμα αποθηκευμένης βιβλιοθήκης).</dd>
<dt>❓ Ελλιπή</dt><dd>Πόσα τραγούδια δεν έχουν είδος, καλλιτέχνη, άλμπουμ ή έτος (με κουμπί «Εμφάνιση») και κουμπί <b>🌐 Αναζήτηση στο web για τα ελλιπή</b>, που ξαναδοκιμάζει και όσα δεν βρέθηκαν παλιότερα.</dd>
<dt>🌐 Προτάσεις</dt><dd>Αποτελέσματα από το iTunes/MusicBrainz με ποσοστό βεβαιότητας. <b>Έγκριση όσων ≥ 80%</b>, <b>Έγκριση όλων</b>, <b>Απόρριψη όλων</b> ή ✓/✕ ανά πρόταση.</dd>
<dt>🧰 Δεδομένα</dt><dd>Συνολική διάρκεια και μέγεθος, χρόνοι εκκίνησης, τραγούδια χωρίς αρχείο (με κουμπί σύνδεσης), <b>Αναίρεση δεδομένων από το web</b>, καθαρισμός αποθηκευμένων αποτελεσμάτων web, διαγραφή της βιβλιοθήκης που κρατά ο browser, και στην εφαρμογή desktop: αντίγραφα ασφαλείας και αρχείο διαγνωστικών.</dd>
</dl>`},

{id:"faq",i:"🛟",t:"Συχνά προβλήματα",h:`
<dl class="hl-dl">
<dt>Άνοιξα τη βιβλιοθήκη αλλά τα τραγούδια δεν παίζουν.</dt><dd>Η βιβλιοθήκη δεν περιέχει τα αρχεία. Πάτα 📚 → ⟳ Συγχρονισμός φακέλων (ή ＋ → Φάκελοι) και διάλεξε ξανά τους φακέλους.</dd>
<dt>Το Automix / Set wizard βγάζει λίγα ή καθόλου τραγούδια.</dt><dd>Τα φίλτρα (είδη, BPM, «μόνο με key και BPM») αφήνουν λίγη μουσική. Κάνε πρώτα ⋯ → 🎼 Ανίχνευση key & BPM, χαλάρωσε τα φίλτρα και δες τον μετρητή «Διαθέσιμα» στο κάτω μέρος.</dd>
<dt>Δεν ακούγονται fade ή crossfade.</dt><dd>Έλεγξε ότι ο <b>Audiophile mode</b> είναι κλειστός και ότι το Fade out/in δεν είναι 0.</dd>
<dt>Η εγγραφή βγήκε χωρίς ήχο.</dt><dd>Κλείσε τον Audiophile mode. Ξεκίνα εγγραφή και παίξε μουσική· αν εμφανιστεί προειδοποίηση «δεν ανιχνεύεται ήχος», δες ότι παίζει τραγούδι από το πρόγραμμα (όχι από άλλη εφαρμογή).</dd>
<dt>Το key ή το BPM δεν είναι σωστό.</dt><dd>Η αυτόματη ανίχνευση είναι εκτίμηση. Διόρθωσε το τραγούδι από το ⓘ / ✏️ ή γράψε τις τιμές στα tags με εξειδικευμένο πρόγραμμα.</dd>
<dt>Η ενέργεια δεν μου φαίνεται σωστή.</dt><dd>Άνοιξε ⚡ Ενέργεια, ανάλυσε ξανά και διόρθωσε στην οθόνη ελέγχου (ή αλλαξε το «Σύγκριση μέσα σε» σε είδος/φάκελο).</dd>
<dt>Έχω πολλά διπλά ή είδη με διαφορετική γραφή.</dt><dd>⚙ Διαχείριση → ♊ Διπλότυπα και 🏷 Είδη (μετονομασία/συγχώνευση).</dd>
<dt>Φοβάμαι μην χάσω δεδομένα.</dt><dd>Ενεργοποίησε «Αυτόματη αποθήκευση» και κράτα αντίγραφο του αρχείου βιβλιοθήκης. Στην εφαρμογή desktop υπάρχουν αυτόματα αντίγραφα ασφαλείας.</dd>
</dl>`}
